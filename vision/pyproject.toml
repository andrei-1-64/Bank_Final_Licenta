[project]
name = "bank-vision"
version = "0.1.0"
description = "BanK vision-service: stateless image/PDF extraction (OCR, face embeddings)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Required by FastAPI's UploadFile/File(...) to parse multipart/form-data.
    "python-multipart>=0.0.12",
    # OCR: wraps the system tesseract-ocr binary (installed in the
    # Dockerfile, apt packages tesseract-ocr + tesseract-ocr-ron).
    "pytesseract>=0.3.10",
    "Pillow>=10.4",
    # PDF: renders pages to images for OCR, and reads native text layers.
    # Pure-Python wheel, bundles its own renderer - no system package needed.
    "pymupdf>=1.24",
    # Face embeddings - dlib is a heavy native build, see the Dockerfile.
    # This dependency is the entire reason this service exists separately
    # from the banking backend.
    "face-recognition>=1.3.0",
    # face-recognition-models (pulled in above, last released 2018) still
    # imports the old `pkg_resources` API at runtime; setuptools 81+ dropped
    # it, so this needs pinning below that rather than left unpinned.
    "setuptools<81",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.File"]
