server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The dashboard is the entry point; app.js redirects to login.html when
    # there's no valid session (see api.js::requireSession).
    index index.html;

    # Never cache the HTML/JS during development - otherwise a browser holds
    # on to a stale app.js after every edit and it looks like the change
    # didn't take.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }
}
